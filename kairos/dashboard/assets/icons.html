<!-- Icon sprite and wordmark.
     Drawn here rather than fetched: the page must hold together with no
     network, and every glyph needs to key off currentColor so it tracks the
     active theme. 16x16 grid, 1.5 stroke, square caps to read as drafting
     linework rather than a UI icon set. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!-- Brand mark: an extruded L-bracket in isometric, the part family this
         project was built around. Three tones for the three visible faces,
         which is also how the viewport shades a solid. -->
    <symbol id="mark" viewBox="0 0 32 32">
      <g stroke="none">
        <path d="M4 10 L16 3 L28 10 L16 17 Z" fill="currentColor" opacity="0.95"/>
        <path d="M4 10 L16 17 L16 29 L4 22 Z" fill="currentColor" opacity="0.55"/>
        <path d="M28 10 L16 17 L16 29 L28 22 Z" fill="currentColor" opacity="0.28"/>
      </g>
    </symbol>

    <!-- Feature operations, matching the executor's vocabulary. -->
    <symbol id="i-sketch" viewBox="0 0 16 16">
      <path d="M2.5 13.5 L13.5 2.5 M2.5 13.5 L2.5 10 M2.5 13.5 L6 13.5"/>
      <circle cx="13.5" cy="2.5" r="1.2"/>
    </symbol>
    <symbol id="i-line" viewBox="0 0 16 16">
      <path d="M3 13 L13 3"/><circle cx="3" cy="13" r="1.3"/><circle cx="13" cy="3" r="1.3"/>
    </symbol>
    <symbol id="i-circle" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="5"/><path d="M8 8 L13 8" stroke-dasharray="1.5 1.5"/>
    </symbol>
    <symbol id="i-rect" viewBox="0 0 16 16">
      <rect x="2.5" y="4.5" width="11" height="7"/>
    </symbol>
    <symbol id="i-pad" viewBox="0 0 16 16">
      <path d="M3 10 L8 7.5 L13 10 L8 12.5 Z"/><path d="M8 7.5 L8 3"/><path d="M5.5 5 L8 2.5 L10.5 5"/>
    </symbol>
    <symbol id="i-pocket" viewBox="0 0 16 16">
      <path d="M3 6 L8 3.5 L13 6 L8 8.5 Z"/><path d="M8 8.5 L8 13"/><path d="M5.5 11 L8 13.5 L10.5 11"/>
    </symbol>
    <symbol id="i-revolve" viewBox="0 0 16 16">
      <path d="M8 2 L8 14" stroke-dasharray="2 1.5"/>
      <path d="M11 4.5 C13.5 6 13.5 10 11 11.5"/><path d="M5 4.5 C2.5 6 2.5 10 5 11.5"/>
    </symbol>
    <symbol id="i-fillet" viewBox="0 0 16 16">
      <path d="M3 13 L3 8 C3 5 5 3 8 3 L13 3"/>
    </symbol>
    <symbol id="i-chamfer" viewBox="0 0 16 16">
      <path d="M3 13 L3 8 L8 3 L13 3"/>
    </symbol>
    <symbol id="i-pattern" viewBox="0 0 16 16">
      <rect x="2" y="2" width="4" height="4"/><rect x="10" y="2" width="4" height="4"/>
      <rect x="2" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/>
    </symbol>
    <symbol id="i-finish" viewBox="0 0 16 16">
      <path d="M3 8.5 L6.5 12 L13 4"/>
    </symbol>

    <!-- Views -->
    <symbol id="i-iso" viewBox="0 0 16 16">
      <path d="M8 2 L14 5.5 L14 11 L8 14.5 L2 11 L2 5.5 Z"/>
      <path d="M8 2 L8 8 M8 8 L14 5.5 M8 8 L2 5.5" opacity="0.6"/>
    </symbol>
    <symbol id="i-front" viewBox="0 0 16 16">
      <rect x="3" y="3" width="10" height="10"/><path d="M3 3 L13 13" opacity="0"/>
    </symbol>
    <symbol id="i-top" viewBox="0 0 16 16">
      <path d="M8 3 L14 6.5 L8 10 L2 6.5 Z"/><path d="M2 6.5 L2 9.5 L8 13 L14 9.5 L14 6.5" opacity="0.5"/>
    </symbol>
    <symbol id="i-right" viewBox="0 0 16 16">
      <path d="M5 3 L11 6 L11 13 L5 10 Z"/>
    </symbol>
    <symbol id="i-fit" viewBox="0 0 16 16">
      <path d="M2 5.5 L2 2 L5.5 2 M10.5 2 L14 2 L14 5.5 M14 10.5 L14 14 L10.5 14 M5.5 14 L2 14 L2 10.5"/>
      <rect x="5.5" y="5.5" width="5" height="5" opacity="0.5"/>
    </symbol>

    <!-- Display -->
    <symbol id="i-grid" viewBox="0 0 16 16">
      <path d="M2 6 L14 6 M2 10 L14 10 M6 2 L6 14 M10 2 L10 14"/>
    </symbol>
    <symbol id="i-shaded" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="5.5"/>
      <path d="M8 2.5 A5.5 5.5 0 0 1 8 13.5 Z" fill="currentColor" stroke="none" opacity="0.45"/>

    <symbol id="i-measure" viewBox="0 0 16 16">

      <path d="M5 8 L6.5 9.5 M7.5 5.5 L9 7 M10 3 L11.5 4.5" opacity="0.7"/>

    <!-- Navigation -->
    <symbol id="i-orbit" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="4"/>
      <ellipse cx="8" cy="8" rx="6.5" ry="2.6" transform="rotate(-25 8 8)"/>
    </symbol>
    <symbol id="i-pan" viewBox="0 0 16 16">
      <path d="M8 2 L8 14 M2 8 L14 8"/>
      <path d="M8 2 L6.3 4 M8 2 L9.7 4 M8 14 L6.3 12 M8 14 L9.7 12"/>
      <path d="M2 8 L4 6.3 M2 8 L4 9.7 M14 8 L12 6.3 M14 8 L12 9.7"/>

    <symbol id="i-zoom" viewBox="0 0 16 16">
      <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14"/><path d="M5 7 L9 7"/>
    </symbol>

    <!-- Browser affordances -->
    <symbol id="i-eye" viewBox="0 0 16 16">
      <path d="M1.5 8 C4 4 12 4 14.5 8 C12 12 4 12 1.5 8 Z"/><circle cx="8" cy="8" r="1.8"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 16 16">
      <path d="M2 12.5 L2 4 L6 4 L7.5 6 L14 6 L14 12.5 Z"/>
    </symbol>
    <symbol id="i-body" viewBox="0 0 16 16">
      <path d="M8 2.5 L13.5 5.5 L13.5 10.5 L8 13.5 L2.5 10.5 L2.5 5.5 Z"/>
    </symbol>

  </defs>
</svg>
