[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-cad"
version = "0.1.0"
description = "KAIROS: Knowledge-Augmented Interactive Reinforcement Optimization System — sequential geometric decision-making for parametric CAD"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sunkalp Chandra", email = "sunkalp.chandra@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["kairos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cad: tests that require a working FreeCAD installation",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
