name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check kairos tests scripts
      - name: Test (non-CAD)
        run: pytest -m "not cad" -q

  checks:
    # Guards that need no dataset and no run artifacts, so they can gate every
    # push. The doc-table gate (scripts/sync_docs.py --check) is deliberately
    # absent: it reads runs/*_traces.jsonl, which are not committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Text hygiene
        # A repo-wide punctuation sweep once collapsed the regex class [x*] to
        # [xx] in the requirement parser. It still matched ASCII x, so the whole
        # suite passed while any requirement using the other character silently
        # lost its envelope constraint.
        run: python3 scripts/check_text.py
      - name: Built pages match their assets
        # docs/index.html inlines the stylesheet, sprite and scripts. Editing an
        # asset without rebuilding ships a page that renders fine and is simply
        # not the thing in the repository.
        run: python3 scripts/check_station.py

  cad:
    # FreeCAD's bundled interpreter, which is where the CAD half of the project
    # lives. These tests had never run anywhere but a developer machine.
    #
    # The package and the console binary are named differently across distros:
    # Debian ships freecad-python3 providing `freecadcmd`, Ubuntu ships freecad
    # providing `FreeCADCmd`. The first attempt at this job hardcoded Debian's
    # name and failed with "Unable to locate package", so both are tried and
    # the binary is discovered rather than assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FreeCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad-python3 \
            || sudo apt-get install -y --no-install-recommends freecad
      - name: Locate the console interpreter
        id: freecad
        run: |
          for candidate in freecadcmd FreeCADCmd freecad-python3 freecadcmd0; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "binary=$candidate" >> "$GITHUB_OUTPUT"
              echo "found $candidate"
              exit 0
            fi
          done
          echo "no FreeCAD console binary on PATH; candidates tried:" >&2
          ls /usr/bin | grep -i freecad >&2 || echo "(nothing matching freecad)" >&2
          exit 1
      - name: Install test dependencies into FreeCAD's interpreter
        run: |
          # FreeCAD's python is separate from the runner's, so pytest has to be
          # available to it specifically.
          ${{ steps.freecad.outputs.binary }} -c "
          import subprocess, sys
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
                                 '--break-system-packages', 'pytest', 'numpy'])
          "
      - name: CAD tests
        run: |
          PYTHONPATH="$PWD" ${{ steps.freecad.outputs.binary }} -c "
          import sys, pytest
          sys.exit(pytest.main(['-m', 'cad', '-q', 'tests']))
          "
