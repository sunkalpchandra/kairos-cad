name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check kairos tests scripts
      - name: Test (non-CAD)
        run: pytest -m "not cad" -q

  # CAD integration tests need a FreeCAD installation; they run locally via
  # `make test-cad`. Packaging FreeCAD into CI (apt or AppImage) is tracked
  # as future work.
