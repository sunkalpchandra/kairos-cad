name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check kairos tests scripts
      - name: Test (non-CAD)
        run: pytest -m "not cad" -q

  checks:
    # Guards that need no dataset and no run artifacts, so they can gate every
    # push. The doc-table gate (scripts/sync_docs.py --check) is deliberately
    # absent: it reads runs/*_traces.jsonl, which are not committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Text hygiene
        # A repo-wide punctuation sweep once collapsed the regex class [x*] to
        # [xx] in the requirement parser. It still matched ASCII x, so the whole
        # suite passed while any requirement using the other character silently
        # lost its envelope constraint.
        run: python3 scripts/check_text.py
      - name: Built pages match their assets
        # docs/index.html inlines the stylesheet, sprite and scripts. Editing an
        # asset without rebuilding ships a page that renders fine and is simply
        # not the thing in the repository.
        run: python3 scripts/check_station.py

  cad:
    # FreeCAD's interpreter, which is where the CAD half of the project lives.
    #
    # Debian rather than the Ubuntu runner: noble has no installable freecad.
    #
    # pytest runs INSIDE FreeCADCmd rather than under system python. Importing
    # FreeCAD from plain python succeeds but gives a core without workbenches:
    # Sketcher and PartDesign live in Mod/ directories that FreeCADCmd sets up
    # during startup, and adding those to PYTHONPATH by hand is not equivalent
    # (tried; every recipe still died at CREATE_SKETCH). That is exactly why
    # the Makefile drives the bundled interpreter on macOS too.
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Install FreeCAD
        run: |
          apt-get update
          apt-get install -y freecad-python3
          apt-get install -y --no-install-recommends \
            git ca-certificates python3-pip python3-numpy
      - uses: actions/checkout@v4
      - name: Install pytest
        # freecad-python3 shares the system python on Debian, so a system-level
        # install is visible inside FreeCADCmd.
        run: pip3 install --break-system-packages pytest
      - name: CAD tests
        run: |
          cat > /tmp/run_cad_tests.py <<'RUNNER'
          import sys, pytest
          sys.path.insert(0, "/__w/kairos-cad/kairos-cad")
          sys.exit(pytest.main(["-m", "cad", "-q", "tests"]))
          RUNNER
          cd "$GITHUB_WORKSPACE"
          freecadcmd /tmp/run_cad_tests.py
