name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check kairos tests scripts
      - name: Test (non-CAD)
        run: pytest -m "not cad" -q

  checks:
    # Guards that need no dataset and no run artifacts, so they can gate every
    # push. The doc-table gate (scripts/sync_docs.py --check) is deliberately
    # absent: it reads runs/*_traces.jsonl, which are not committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Text hygiene
        # A repo-wide punctuation sweep once collapsed the regex class [x*] to
        # [xx] in the requirement parser. It still matched ASCII x, so the whole
        # suite passed while any requirement using the other character silently
        # lost its envelope constraint.
        run: python3 scripts/check_text.py
      - name: Built pages match their assets
        # docs/index.html inlines the stylesheet, sprite and scripts. Editing an
        # asset without rebuilding ships a page that renders fine and is simply
        # not the thing in the repository.
        run: python3 scripts/check_station.py

  cad:
    # FreeCAD's interpreter, which is where the CAD half of the project lives.
    # These tests (90 of them, deselected from every other job) had never run
    # anywhere but a developer machine.
    #
    # Debian rather than the Ubuntu runner: noble has neither freecad-python3
    # nor an installable freecad ("no installation candidate"), while bookworm
    # ships freecad-python3. That is also what deploy/Dockerfile builds on, so
    # this job doubles as a check on the image's package assumption.
    #
    # The module path is DISCOVERED from the package manifest, not assumed.
    # Getting here took four wrong guesses: the Ubuntu package name, an
    # installable freecad on Ubuntu at all, `freecadcmd -m pip` (freecadcmd is
    # not a python binary), and finally that freecad-python3 lands on the
    # default sys.path (it does not).
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Install FreeCAD
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            freecad-python3 git ca-certificates python3-pip python3-numpy
      - uses: actions/checkout@v4
      - name: Discover the FreeCAD module path
        id: freecad
        run: |
          # freecad-python3 is a metapackage and ships no module itself, so
          # search the filesystem rather than one package's manifest.
          echo "--- installed freecad packages ---"
          dpkg -l | grep -i freecad || true
          module=$(find / -name 'FreeCAD.so' -o -name 'FreeCAD.py' 2>/dev/null | head -1)
          if [ -z "$module" ]; then
            echo "no FreeCAD module anywhere on the filesystem:" >&2
            find / -iname 'freecad*' -maxdepth 6 2>/dev/null | head -30 >&2
            exit 1
          fi
          dir=$(dirname "$module")
          echo "FreeCAD module at $module"
          echo "pythonpath=$dir" >> "$GITHUB_OUTPUT"
      - name: Confirm FreeCAD imports
        run: |
          PYTHONPATH="${{ steps.freecad.outputs.pythonpath }}" python3 -c "
          import FreeCAD
          print('FreeCAD', '.'.join(FreeCAD.Version()[:2]))
          "
      - name: Install test dependencies
        run: pip3 install --break-system-packages pytest
      - name: CAD tests
        run: |
          PYTHONPATH="$PWD:${{ steps.freecad.outputs.pythonpath }}" \
            python3 -m pytest -m cad -q tests
