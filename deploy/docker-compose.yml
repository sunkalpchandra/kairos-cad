# KAIROS sandbox services.
#
#   docker compose -f deploy/docker-compose.yml run --rm generate
#   docker compose -f deploy/docker-compose.yml run --rm benchmark
#   docker compose -f deploy/docker-compose.yml run --rm station
#
# Every service shares the same image and the same two volumes, so a dataset
# generated by one is the dataset the others measure against.

x-kairos: &kairos
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: kairos:latest
  volumes:
    - ../dataset:/app/dataset
    - ../runs:/app/runs
    - ../docs:/app/docs
  working_dir: /app

services:
  # 1,080 validated designs across 8 shards, ~9 minutes. Renders are off by
  # default; KAIROS_RENDER=1 adds the PNG views at roughly double the cost.
  generate:
    <<: *kairos
    command: bash scripts/generate_dataset.sh dataset 135

  # Every expert step must round-trip through the action codec. Exits non-zero
  # above 0%, so it is a gate rather than a report.
  audit:
    <<: *kairos
    command: python3 scripts/audit_codec.py --root dataset --max-rate 0.0

  # Behavioural cloning. CPU-only in the image; on a host with CUDA, add a
  # deploy.resources GPU reservation and install the matching torch wheel.
  train:
    <<: *kairos
    command: python3 scripts/train_bc.py --root dataset --out runs/bc

  # The baselines alone need no checkpoints, so this runs on a fresh clone.
  benchmark:
    <<: *kairos
    command: >
      python3 scripts/run_benchmark.py --preset core
      --policies oracle-replay,scripted-spec,immediate-finish,legal-random
      --out runs/benchmark_core

  # Rebuild the static review station from whatever is in runs/.
  station:
    <<: *kairos
    command: >
      python3 scripts/build_dashboard.py --layout studio
      --out docs/kairos.html --stamp kairos-cad-v1

  # Serve the built station. Static file, so any web server would do; this
  # avoids adding one to the image.
  serve:
    <<: *kairos
    command: python3 -m http.server 8080 --directory docs
    ports:
      - "8080:8080"
