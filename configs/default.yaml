# KAIROS default experiment configuration.
# Everything an experiment varies lives here — code contains no magic numbers
# for episode limits, reward weights, or dataset sizes.

seed: 0

environment:
  requirement: >-
    Create an L-bracket with 4 M5 mounting holes, 3 mm minimum wall
    thickness, 90 degree angle, and minimum possible mass.
  max_steps: 40
  material: aluminum

reward:
  valid_sketch: 0.2
  fully_constrained_sketch: 0.5
  first_solid: 0.5
  constraint_satisfied: 0.5
  all_constraints: 2.0
  mass_progress: 1.0
  finish_success: 5.0
  finish_failure: -1.0
  validity_broken: -1.0
  invalid_action: -0.5
  complexity: -0.02
  action_cost: -0.01

dataset:
  designs: 1080
  shards: 8
  out_dir: dataset/designs
  families: null  # null = all registered families

# Phase 4: multimodal VLA and behavioral cloning. Requires the 'learn' extra.
model:
  embed_dim: 128
  language_depth: 2
  language_heads: 4
  max_text_length: 64
  vision_widths: [16, 32, 64, 128]
  fusion_depth: 2
  fusion_heads: 4
  operation_embed_dim: 32
  hidden_dim: 128
  dropout: 0.1

behavioral_cloning:
  epochs: 40
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.0001
  parameter_loss_weight: 1.0
  # Held out by design, never by step: steps within one design are far too
  # correlated for a step-level split to measure generalization.
  val_fraction: 0.15
  grad_clip: 1.0
  class_weighting: inverse_sqrt
  device: auto  # auto picks Metal on Apple silicon, then CUDA, then CPU
  out_dir: runs/bc

# Phase 5: PPO fine-tuning of the BC policy against the live CAD environment.
# Every rollout step is a FreeCAD recompute, so iterations are small and the
# numbers below are chosen for wall-clock, not sample efficiency.
ppo:
  iterations: 30
  steps_per_iteration: 256
  max_episode_steps: 40
  eval_every: 5
  # Best-checkpoint selection reads this estimate, so it has to be big
  # enough to mean something: a 6-episode eval once reported 0.50 for a
  # policy that scored 0.286 over 14 episodes.
  eval_episodes: 16
  learning_rate: 0.0001
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  # KL against the frozen BC policy. Without it PPO drifts off the
  # demonstration manifold chasing shaping reward and never recovers, because
  # random exploration does not rediscover a valid multi-step build.
  bc_kl_coef: 0.05
  target_kl: 0.05
  epochs_per_update: 4
  minibatch_size: 32
  gamma: 0.99
  gae_lambda: 0.95
  out_dir: runs/ppo

# Phase 6: surrogate-driven design optimization.
optimization:
  family: plate
  # Manufacturing floor the optimized part must clear, mm.
  min_thickness: 5.0
  # FreeCAD builds used to fit the surrogate. Each one costs a real recompute
  # plus a wall-thickness ray-cast, so this is the run's dominant cost.
  samples: 60
  iterations: 20
  population: 128
  # Degree 3, not 2: mass is a three-way product of dimensions, and a quadratic
  # surrogate gets the thickness direction wrong while still scoring R2 ~ 0.997.
  surrogate_degree: 3
  out_dir: runs/optimize
