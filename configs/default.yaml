# KAIROS default experiment configuration.
# Everything an experiment varies lives here — code contains no magic numbers
# for episode limits, reward weights, or dataset sizes.

seed: 0

environment:
  requirement: >-
    Create an L-bracket with 4 M5 mounting holes, 3 mm minimum wall
    thickness, 90 degree angle, and minimum possible mass.
  max_steps: 40
  material: aluminum

reward:
  valid_sketch: 0.2
  fully_constrained_sketch: 0.5
  first_solid: 0.5
  constraint_satisfied: 0.5
  all_constraints: 2.0
  mass_progress: 1.0
  finish_success: 5.0
  finish_failure: -1.0
  validity_broken: -1.0
  invalid_action: -0.5
  complexity: -0.02
  action_cost: -0.01

dataset:
  designs: 1080
  shards: 8
  out_dir: dataset/designs
  families: null  # null = all registered families

# Phase 4: multimodal VLA and behavioral cloning. Requires the 'learn' extra.
model:
  embed_dim: 128
  language_depth: 2
  language_heads: 4
  max_text_length: 64
  vision_widths: [16, 32, 64, 128]
  fusion_depth: 2
  fusion_heads: 4
  operation_embed_dim: 32
  hidden_dim: 128
  dropout: 0.1

behavioral_cloning:
  epochs: 40
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.0001
  parameter_loss_weight: 1.0
  # Held out by design, never by step: steps within one design are far too
  # correlated for a step-level split to measure generalization.
  val_fraction: 0.15
  grad_clip: 1.0
  class_weighting: inverse_sqrt
  device: auto  # auto picks Metal on Apple silicon, then CUDA, then CPU
  out_dir: runs/bc
